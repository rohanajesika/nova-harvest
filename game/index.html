<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Harvest — a lantern-moth arcade game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #070a18;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
    background: #0b1026;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  noscript p {
    color: #eef1f5;
    font-family: "Trebuchet MS", sans-serif;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Nova Harvest game canvas"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Nova Harvest needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
